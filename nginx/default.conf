# 上游用 upstream + resolve：容器重建换了 IP 也能自动跟上（nginx ≥1.27.3）
resolver 127.0.0.11 valid=10s ipv6=off;

upstream plant_backend {
    zone plant_backend 64k;
    server backend:8000 resolve;
}

upstream plant_zlm {
    zone plant_zlm 64k;
    server zlm:80 resolve;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 前端
    root /usr/share/nginx/html;
    index index.html;

    # 构建产物带内容哈希，可以长缓存；文件名一变自然失效
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 绝不能缓存：否则旧 HTML 会去找已被 vite 删掉的旧 chunk，
    # 表现为"点了没反应"（动态导入 404，路由静默中止）。这是 2026-11-07 实测故障根因。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
    }

    location / { try_files $uri $uri/ /index.html; }

    # ZLM hook 只接受 ZLM 容器内网直连 backend:8000，外部调用一律 403
    # （backend 侧还会检查 X-Forwarded-For，双保险）
    location /api/zlm/ { return 403; }

    # 后端 API
    location /api/ {
        proxy_pass http://plant_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_set_header Connection "";
    }

    # 视频流（同源，避 CORS）
    location /live/ {
        proxy_pass http://plant_zlm;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 3s;
    }

    # ZLM API（管理用，同源）
    location /index/api/ {
        proxy_pass http://plant_zlm;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    # 组态只读页
    location /view/ { try_files $uri $uri/ /index.html; }
}
