[general]
enable_vhost=1
enableCluster=0
streamNoneReaderDelayMS=3600000
maxStreamCount=0
flowThreshold=1024

[api]
apiDebug=1
secret=LuQi-Video-2026-Secret-Key
roots=

[http]
charSet=utf-8
keepAliveSecond=30
maxReqSize=40960
port=80
rootPath=./www
sendBufSize=65536
sslport=443

[rtsp]
authBasic=0
port=554
sslport=322

[rtmp]
handshakeSecond=15
keepAliveSecond=15
port=1935
sslport=19350

[rtp_proxy]
port=10000
timeoutSec=15
port_range=30000-30500

[hls]
segNum=3
segRetain=5
segDuration=2
segKeep=0

[hook]
# 安全整改 03：播放/推流一律回后端鉴权（返回 {"code":0} 才放行）
# 注意 hook 是 ZLM 自己的 code 约定，不是 HTTP 状态码
enable=1
on_play=http://backend:8000/api/zlm/on_play
on_publish=http://backend:8000/api/zlm/on_publish
timeoutSec=10
alive_interval=10

[record]
appName=record
sampleMS=500
fileSecond=3600
filePath=./www
fileBufSize=65536
